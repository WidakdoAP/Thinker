<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="RegisterForm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Thinker</title>
</head>
<body>
    <header class="navbar">
      <div class="navbar-left">
        <img src="../asset/3.png" class="navbar-logo">
        <img src="../asset/2.png" class="navbar-logo">
      </div>
    </header>
    
    <div class="container">
        <nav class="sidebar">
        <ul>
          <li><i class="fas fa-home"></i><a href="">Home</a></li>
          <li><i class="fas fa-user"></i><a href="../user/UserForm.html">User</a></li>
          <li><i class="fas fa-question-circle"></i><a href="../question/QuestionForm.html">Question</a></li>
          <li><i class="fas fa-key"></i><a href="#">Keyword</a></li>
        </ul>
        </nav>

        <main class="content">
            <form class="login-form" id="loginForm" onsubmit="return validateForm()" action="Register.php" method="post">
                <img src="../asset/logo.png" alt="Logo Website" class="logo">
              
                <input type="text" id="username" placeholder="Username" name="username">
              
                <div class="password-container">
                  <input type="password" id="password" placeholder="Password" name="password">
                  <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
                </div>
              
                <div class="button">
                  <button type="submit">Register</button>
                </div>
              
                <p id="error-message" style="color:red; margin-top: 1rem;"></p>
            </form>         
        </main>
    </div>
    <script src="RegisterForm.js"></script>
</body>
</html>
